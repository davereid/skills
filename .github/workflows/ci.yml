name: CI

on:
  pull_request:
  push:
    branches: [main, '[0-9]*.x'] # Not release-please's own release-please--branches--1.x.
  # Weekly, to catch new zizmor findings.
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-actions:
    name: Lint actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Run zizmor
        if: ${{ !cancelled() }} # Also report zizmor's findings when actionlint fails.
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false # Fail the job on findings instead of uploading them to code scanning.
